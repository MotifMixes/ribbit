[package]
name = "ribbit-didj"
description = "LeapFrog Didj emulation: LF1000 machine, display, 3D engine, packages and internal NAND"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ribbit-arm.workspace = true
ribbit-armjit.workspace = true
# fatfs for the Brio volume; zip for the packages in the examples.
ribbit-core.workspace = true
crc32fast.workspace = true
# Save states.
serde.workspace = true
bincode = "1.3"
miniz_oxide = "0.8"

[dev-dependencies]
# didjboot's DIDJ_START reads the game's art.
png = "0.18"
