[package]
name = "ribbit-frontend"
description = "Ribbit's user interface (desktop and Android): window, menus, input, sound, saves"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ribbit-core.workspace = true
ribbit-cpu.workspace = true
ribbit-memory.workspace = true
ribbit-video.workspace = true
ribbit-input.workspace = true
ribbit-audio.workspace = true
ribbit-debug.workspace = true
ribbit-zippity.workspace = true
ribbit-twist.workspace = true
ribbit-leappad.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
toml.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
egui = "0.36.2"
egui-wgpu = "0.36.2"
cpal = "0.18"
png = "0.18"
# The frog icon: drawn from egui's own emoji font.
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"
# Reading GitHub's release list (update check).
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
egui-winit = "0.36.2"
rfd = "0.17"
gilrs = "0.11"
# The LeapPad's words (speech recognition on this PC; leappad_words.rs).
ribbit-speech.workspace = true
rayon = "1"
crc32fast = "1"
# The update check (HTTPS to api.github.com).
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# Unpacking the Linux release (.tar.gz) for the in-app update.
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["android-native-activity"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
