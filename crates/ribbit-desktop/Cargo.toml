[package]
name = "ribbit-desktop"
description = "Ribbit desktop frontend and headless test runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ribbit"
path = "src/main.rs"

# The windowed app (no console window): double-click to play.
[[bin]]
name = "ribbit-gui"
path = "src/app.rs"

[dependencies]
ribbit-core.workspace = true
ribbit-cpu.workspace = true
ribbit-memory.workspace = true
ribbit-video.workspace = true
ribbit-input.workspace = true
ribbit-debug.workspace = true
ribbit-frontend.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true

[build-dependencies]
embed-resource = "3"
