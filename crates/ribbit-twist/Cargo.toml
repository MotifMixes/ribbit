[package]
name = "ribbit-twist"
description = "LeapFrog RockIt Twist: its controls, package and firmware formats, and the machine (early emulation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ribbit-arm.workspace = true
# Save states (as the Zippity's).
serde.workspace = true
bincode = "1.3"

[dev-dependencies]
