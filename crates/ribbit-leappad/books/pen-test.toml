# Ribbit's pen test book: an original test fixture, not a LeapFrog book.
#
# Each spread has a grid of numbered targets on both pages and a GO spot. Touching a target puts the
# emulated pen there; the cartridge's own software decides what happens, and its debug log shows where it
# felt the touch, which `tests/books.rs` compares with the target. Coordinates are the cartridge's page
# units (docs/leappad-books.md).
format = 1
title = "Ribbit Pen Test Book"

[[spread]]
name = "Grid A"
# A test GO spot near the top-left corner of the left page, where Tutter's Tiny Trip reacts with a
# page-pointer touch (docs/leappad.md, "Pen position").
go = { page = "left", x = 100, y = 100 }

  [[spread.region]]
  name = "Grid A 1"
  page = "left"
  rect = [155, 235, 347, 444]

